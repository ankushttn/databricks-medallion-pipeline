[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast tests without Spark (config, metrics, pure logic)
    spark: tests requiring a local Spark session
    integration: end-to-end pipeline tests across layers
    data_generation: sample data generation and defect validation
    bronze: Bronze ingestion and schema
    silver: Silver quality dimensions
    gold: Gold aggregations and reconciliation
    dashboard: dashboard SQL queries
addopts = -ra
